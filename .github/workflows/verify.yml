name: verify

on:
  push:
  pull_request:

jobs:
  oracle:
    name: Strict Classic certification and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build oracle
        run: make
      - name: Verify corpus, quines, compressed programs and rejection controls
        run: make test
      - name: Reconstruct all four compressed programs without changing artifacts
        run: make test-rebuild

  synthesize-record:
    name: Synthesize m=281 and check byte-exact regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build oracle
        run: make
      - name: Synthesize best verified quine of this family (~13 min)
        run: python3 synthesize.py 281
      - name: Byte-exact regression vs published artifact
        run: |
          echo "96b670b825372a0f41fa3b574d47457f92654b76411e5d5be4c438003087610e  artifacts/candidate_m281_53562b.mal" | sha256sum -c -
      - name: Execute the rebuilt quine under the strict oracle
        run: make test-quines
